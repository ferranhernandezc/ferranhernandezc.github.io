  sections:
    Research Interests:
      - highlights:
          - "Foundations and limitations of graph neural networks; long-range information propagation and over-squashing; sheaf and topological neural networks; principled benchmarking and evaluation of neural architectures."

    Education:
      - institution: University of Cambridge
        location: Cambridge, UK
        area: PhD Candidate, Supervisor Prof. Pietro Liò
        start_date: 2025-10
        end_date: 2028-10 (expected)
        summary: Fully funded by a La Caixa Postgraduate Fellowship
        highlights:
          - "Researching the foundations and limitations of graph neural networks and their higher-order variants, with a focus on long-range information propagation and over-squashing."
          - "Showed that commonly used benchmarks for long-range graph tasks do not reliably measure long-range capability. Introduced TRIP and GRIP, synthetic frameworks that let us provably and quantifiably test it."
          - "Led this work to a first-author NeurIPS 2026 paper (Evaluations & Datasets Track)."
          - "Collaborate with researchers at Queen Mary University of London, Microsoft, and other departments at Cambridge."

      - institution: Universitat Politècnica de Catalunya (UPC) — CFIS
        location: Barcelona, Spain
        area: BSc Mathematics (GPA 8.8/10) & BSc Data Science and Engineering (GPA 9.0/10), double degree
        start_date: 2019-09
        end_date: 2024-05
        highlights:
          - "Admitted to CFIS (Interdisciplinary Higher Education Center), a selective programme that takes about 40 students per year from across Spain."
